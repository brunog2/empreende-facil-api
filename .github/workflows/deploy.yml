name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Deploy on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          SSH="ssh -i $HOME/.ssh/vps_key -o StrictHostKeyChecking=accept-new"
          $SSH "$VPS_USER@$VPS_HOST" "sudo mkdir -p /opt/empreende-facil/app && sudo chown $VPS_USER:$VPS_USER /opt/empreende-facil /opt/empreende-facil/app"
          rsync -az \
            -e "ssh -i $HOME/.ssh/vps_key -o StrictHostKeyChecking=accept-new" \
            docker scripts \
            "$VPS_USER@$VPS_HOST:/opt/empreende-facil/app/"
          printf '%s' "$GHCR_TOKEN" | $SSH "$VPS_USER@$VPS_HOST" "sudo -n podman login ghcr.io -u '$GHCR_USER' --password-stdin"
          $SSH "$VPS_USER@$VPS_HOST" "cd /opt/empreende-facil/app && API_IMAGE='$API_IMAGE' sh ./scripts/deploy.sh"
